[package]
name = "lechange-python"
version = "0.3.0"
edition = "2021"
authors = ["terekete <spicyzhug@gmail.com>"]
description = "Python bindings for lechange-core"
license = "AGPL-3.0-or-later"
repository = "https://github.com/lituus-io/le-change"

[lib]
name = "_lechange"
crate-type = ["cdylib"]

[dependencies]
# Core library
lechange-core = { package = "le-change", path = "../lechange-core" }

# PyO3 for Python bindings
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py38"] }

# Async runtime (core pipeline is driven via a blocking Runtime)
tokio = { version = "1.35", features = ["rt-multi-thread"] }

# Global runtime management
once_cell = "1.19"


[build-dependencies]
pyo3-build-config = "0.29"

[features]
default = []
